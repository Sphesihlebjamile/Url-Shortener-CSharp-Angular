# The workflow name
name: Backend Build & Test

# The event that triggers the workflow
on:
  push:
      branches:
        - main
        - develop
        - feature/**
  pull_request:
      branches:
        - main
        - develop
        - feature/**

env:
  SOLUTION_PATH: './src/Backend/Backend.slnx'

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clones your repository onto the runner
      - name: Check out repository code
        uses: actions/checkout@v6

      # Step 2: Setup dotnet environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Step 4: Build the project
      - name: Build the project
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Clones your repository onto the runner
      - name: Check out repository code
        uses: actions/checkout@v6

      # Step 2: Setup dotnet environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"

      # Step 3: Test the project
      - name: Test the project
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore
